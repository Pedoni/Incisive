<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="INCISIVE – supporto al benessere mentale">

  <!-- Mobile / PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Incisive">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <title>Incisive</title>

  <!-- SPLASH STYLE -->
  <style>
    body {
      margin: 0;
    }

    #loading {
      position: fixed;
      inset: 0;
      background-color: #8D5A23;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 56px 0;
      z-index: 9999;
    }

    #logo {
      margin-top: auto;
      margin-bottom: auto;
    }

    #logo img {
      width: 260px;          /* LOGO PIÙ GRANDE */
      max-width: 85vw;
    }

    .spinner {
      width: 48px;           /* SPINNER PIÙ GRANDE */
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.35);
      border-top: 4px solid #FFFFFF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 32px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- HTML SPLASH -->
  <div id="loading">
    <div id="logo">
      <img src="assets/images/logo_white.png" alt="Incisive">
    </div>

    <div class="spinner"></div>
  </div>

  <!-- REMOVE SPLASH WHEN FLUTTER IS READY -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.remove();
      }
    });
  </script>

  <!-- FLUTTER BOOTSTRAP -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
